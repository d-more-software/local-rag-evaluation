[project]
name = "rag-evaluation"
version = "0.1.0"
description = "RAG application with LangChain and LLM-as-a-Judge evaluation"
readme = "README.md"
authors = [
    { name = "d-more-software", email = "md.moredavid@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "gradio>=6.31.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag-evaluation = "rag_evaluation.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deepeval>=4.3.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]



[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
